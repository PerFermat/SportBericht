name: Handbuch veröffentlichen

# Lädt das Anwenderhandbuch (handbuch/) per SFTP auf den Webserver,
# sobald sich im Ordner handbuch/ etwas ändert und nach master gepusht wird.
# Manuell startbar über den Reiter "Actions" (workflow_dispatch).

on:
  push:
    branches: [ master ]
    paths:
      - 'handbuch/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Handbuch per SFTP hochladen
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || '22' }}
          # Inhalt von handbuch/ hochladen; strip_components entfernt das führende "handbuch/"
          source: "handbuch/*"
          target: ${{ secrets.SFTP_REMOTE_PATH }}
          strip_components: 1
          overwrite: true
          rm: false
